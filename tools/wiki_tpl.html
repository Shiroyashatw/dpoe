<title>dungeonPOE 圖鑑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：遊戲裡的鑄鐵面板延伸成圖鑑——左側篩選、右側卡片格，點進去是詳情頁（每級表格）。單一暗色主題，跟遊戲同一個世界 */
:root {
  color-scheme: dark;
  --bg: #0d0b0a; --panel: #17140f; --panel2: #201c17; --line: #3a342c; --fr: #5a5248;
  --tx: #e8e2d6; --dim: #9a9086; --title: #f2ede4; --accent: #c9a76a; --sel: #d8cdb6; --sel-ink: #17140f;
  --good: #7bd36b; --bad: #e5574f; --warn: #ffb38a;
  --fire: #ff8a4c; --cold: #8fd6ff; --light: #ffe066; --chaos: #c38bff; --phys: #d9cbb3;
  --serif: "Noto Serif TC", serif; --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--tx); font: 14px/1.65 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; border-bottom: 1px solid var(--fr); padding-bottom: 10px; }
h1 { font: 900 clamp(24px, 3.4vw, 32px)/1.2 var(--serif); margin: 0; color: var(--title); letter-spacing: 0.06em; }
header p { margin: 0; color: var(--dim); font-size: 13px; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 6px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); padding-block: 8px; }
nav.tabs a { text-decoration: none; font-weight: 700; padding: 8px 14px; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--fr); background: var(--panel); }
nav.tabs a small { color: var(--dim); font-weight: 500; font-variant-numeric: tabular-nums; }
nav.tabs a.on { background: var(--sel); color: var(--sel-ink); border-color: var(--sel); }
nav.tabs a.on small { color: var(--sel-ink); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.layout { display: grid; grid-template-columns: 250px 1fr; gap: 16px; align-items: start; }
aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); display: flex; flex-direction: column; gap: 12px; background: var(--panel); border: 1px solid var(--line); padding: 12px; max-height: calc(100vh - 90px); overflow: auto; }
aside h3 { margin: 0 0 6px; font: 700 12px var(--sans); color: var(--dim); letter-spacing: 0.08em; }
#q { width: 100%; font: inherit; color: var(--tx); background: var(--bg); border: 1px solid var(--fr); padding: 8px 10px; min-height: 40px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font: 500 12px var(--sans); color: var(--tx); background: var(--panel2); border: 1px solid var(--line); padding: 3px 8px; min-height: 28px; cursor: pointer; }
.chip.on { background: var(--sel); color: var(--sel-ink); border-color: var(--sel); }
.chip small { color: var(--dim); margin-left: 3px; }
.chip.on small { color: var(--sel-ink); }
.clear { font: 500 12px var(--sans); color: var(--accent); background: none; border: 0; cursor: pointer; padding: 4px 0; text-align: left; }
main { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.count { color: var(--dim); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 8px; }
.card { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; padding: 10px; background: var(--panel); border: 1px solid var(--line); text-decoration: none; min-width: 0; }
.card:hover { border-color: var(--accent); }
.card b { display: block; font-size: 15px; color: var(--title); }
.card .meta { display: block; color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .ln { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12px; color: var(--tx); opacity: 0.85; }
.ic { width: 44px; height: 44px; image-rendering: pixelated; background: #000; border: 1px solid var(--fr); object-fit: contain; }
.ic.big { width: 72px; height: 72px; }
.ic.none { display: inline-block; }
.nodes li.small .ic.none { border: 0; background: none; }
.terms { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 8px; }
.term { padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); scroll-margin-top: 80px; }
.term b { color: var(--title); display: block; }
.term.hit { border-color: var(--accent); }
.detail { display: flex; flex-direction: column; gap: 14px; }
.back { align-self: flex-start; color: var(--accent); text-decoration: none; font-size: 13px; padding: 6px 0; }
.dh { display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: center; }
.dh h2 { margin: 0; font: 900 26px/1.25 var(--serif); color: var(--title); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tag { font-size: 12px; padding: 1px 7px; border: 1px solid var(--fr); color: var(--tx); background: var(--panel2); }
.tag.el-火焰 { color: var(--fire); border-color: var(--fire); } .tag.el-冰冷 { color: var(--cold); border-color: var(--cold); }
.tag.el-閃電 { color: var(--light); border-color: var(--light); } .tag.el-混沌 { color: var(--chaos); border-color: var(--chaos); }
.box { background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; }
.box h3 { margin: 0 0 8px; font: 700 16px var(--serif); color: var(--title); letter-spacing: 0.04em; }
.desc { margin: 0; max-width: 70ch; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.kv div { background: var(--panel2); border: 1px solid var(--line); padding: 6px 10px; }
.kv small { display: block; color: var(--dim); font-size: 12px; }
.kv b { font-variant-numeric: tabular-nums; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--dim); font-weight: 700; font-size: 12px; position: sticky; top: 0; background: var(--panel); }
tr:hover td { background: var(--panel2); }
.aw { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 8px; }
.aw div { padding: 10px 12px; background: var(--panel2); border: 1px solid var(--line); }
.aw b { color: #b592ff; }
.nodes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.nodes li { display: grid; grid-template-columns: 36px 7.5em 1fr; gap: 10px; align-items: center; padding: 6px 8px; background: var(--panel2); border: 1px solid var(--line); }
.nodes li.small { background: transparent; border-style: dashed; color: var(--dim); }
.nodes li .ic { width: 36px; height: 36px; }
.nodes li b { color: var(--title); }
.grp { font-size: 11px; color: var(--sel-ink); background: var(--accent); padding: 0 5px; margin-left: 4px; font-weight: 700; }
.tlink { color: var(--accent); text-decoration: underline dotted; text-underline-offset: 3px; }
.note { color: var(--dim); font-size: 12px; margin: 6px 0 0; }
.empty { color: var(--dim); padding: 30px; text-align: center; border: 1px dashed var(--line); }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  aside { position: static; max-height: none; }
  .nodes li { grid-template-columns: 36px 1fr; }
  .nodes li > span:last-child { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) { .card, .chip { transition: border-color 120ms, background-color 120ms; } }
</style>
<div class="wrap">
  <header><h1>dungeonPOE 圖鑑</h1><p id="ver"></p></header>
  <nav class="tabs" id="tabs" aria-label="分類"></nav>
  <div id="view"></div>
</div>
<script>
const D = __DATA__;
const I = D.icons;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const id = k => String(k).replace(/_/g, '-');
const img = (k, c = '') => (k && I[k] ? `<img class="ic ${c}" src="${I[k]}" alt="">` : `<span class="ic none ${c}"></span>`);
document.getElementById('ver').textContent = `${D.ver} · 從遊戲資料直接讀出 · 技能 ${D.sk.length}、輔助 ${D.sup.length}、光環 ${D.aura.length}、昇華 ${D.asc.length}、名詞 ${D.terms.length}`;
/* 名詞自動連結：長的先比，同一段只連第一次 */
const TN = D.terms.map((t, i) => [t.n, i]).sort((a, b) => b[0].length - a[0].length);
const TRE = new RegExp(TN.map(([n]) => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g');
const TI = Object.fromEntries(TN);
const rich = (s, skip) => {
  const seen = new Set([skip]);
  return esc(s).replace(TRE, w => (seen.has(w) ? w : (seen.add(w), `<a class="tlink" href="#t-${TI[w]}">${w}</a>`)));
};
const CAT = [
  ['skills', '主動技能', D.sk.length],
  ['supports', '輔助', D.sup.length],
  ['auras', '光環／精魂', D.aura.length],
  ['ascend', '昇華', D.asc.length],
  ['terms', '名詞', D.terms.length]
];
/* 篩選狀態（每個分類各自記） */
const F = { q: '', sel: {} };
try { Object.assign(F, JSON.parse(localStorage.getItem('wikiF') || '{}')); } catch (e) {}
const keep = () => { try { localStorage.setItem('wikiF', JSON.stringify(F)); } catch (e) {} };
const sel = (cat, g) => ((F.sel[cat] = F.sel[cat] || {})[g] = F.sel[cat][g] || []);
/* 每個分類的篩選器：[名字, 取值的函式（回傳陣列）] */
const FILTERS = {
  skills: [
    ['類型', x => [x.spell ? '法術' : x.tags.includes('攻擊') ? '攻擊' : '其他']],
    ['武器', x => (x.asc ? ['昇華技能'] : x.wt)],
    ['元素', x => [x.el || '物理／無']],
    ['標籤', x => x.tags]
  ],
  supports: [['能插在', x => (x.need.length ? x.need : ['任何技能'])]],
  auras: [['標籤', x => (x.tags.length ? x.tags : ['光環'])]],
  ascend: [],
  terms: []
};
const LIST = { skills: D.sk, supports: D.sup, auras: D.aura, ascend: D.asc, terms: D.terms };
const text = x => [x.n, x.d, ...(x.tags || []), ...(x.wt || []), x.el, x.asc, ...(x.need || []), ...((x.nodes || []).flatMap(n => [n.n, n.d]))].join(' ').toLowerCase();
function filtered(cat, skipG) {
  const q = F.q.trim().toLowerCase();
  return LIST[cat].filter(x => {
    if (q && !text(x).includes(q)) return false;
    for (const [g, f] of FILTERS[cat]) {
      if (g === skipG) continue;
      const s = sel(cat, g);
      if (s.length && !f(x).some(v => s.includes(v))) return false;
    }
    return true;
  });
}
function tabs(cur) {
  document.getElementById('tabs').innerHTML = CAT.map(([k, n, c]) => `<a href="#${k}" class="${k === cur ? 'on' : ''}" ${k === cur ? 'aria-current="page"' : ''}>${n}<small>${c}</small></a>`).join('');
}
function cardOf(cat, x) {
  if (cat === 'skills')
    return `<a class="card" href="#sk-${id(x.k)}">${img(x.ic)}<span><b>${esc(x.n)}</b><span class="meta">${esc([x.asc ? '昇華：' + x.asc : x.wt.join('、'), x.el].filter(Boolean).join(' · '))}</span><span class="ln">${esc(x.d)}</span></span></a>`;
  if (cat === 'supports')
    return `<a class="card" href="#sup-${id(x.k)}">${img(x.ic)}<span><b>${esc(x.n)}</b><span class="meta">${esc(x.need.length ? '能插在：' + x.need.join('、') : '任何技能都能插')}</span><span class="ln">${esc(x.d)}</span></span></a>`;
  if (cat === 'auras')
    return `<a class="card" href="#aura-${id(x.k)}">${img(x.ic)}<span><b>${esc(x.n)}</b><span class="meta">預留精魂 ${x.sp}</span><span class="ln">${esc(x.d)}</span></span></a>`;
  return `<a class="card" href="#asc-${id(x.k)}">${img(x.ic)}<span><b>${esc(x.n)}</b><span class="meta">${x.nodes.filter(n => n.t === 'big').length} 個大點、${x.nodes.filter(n => n.t === 'small').length} 個小點</span><span class="ln">${esc(x.d)}</span></span></a>`;
}
function listView(cat) {
  tabs(cat);
  const rows = filtered(cat);
  const side = `<aside aria-label="篩選">
      <div><h3>搜尋</h3><input id="q" type="search" placeholder="名字、效果、標籤…" value="${esc(F.q)}" aria-label="搜尋"></div>
      ${FILTERS[cat]
        .map(([g, f]) => {
          const base = filtered(cat, g),
            cnt = {};
          for (const x of LIST[cat]) for (const v of f(x)) cnt[v] = cnt[v] || 0;
          for (const x of base) for (const v of f(x)) cnt[v]++;
          const s = sel(cat, g);
          return `<div><h3>${g}</h3><div class="chips">${Object.keys(cnt)
            .sort((a, b) => cnt[b] - cnt[a])
            .map(v => `<button class="chip ${s.includes(v) ? 'on' : ''}" data-g="${esc(g)}" data-v="${esc(v)}" aria-pressed="${s.includes(v)}">${esc(v)}<small>${cnt[v]}</small></button>`)
            .join('')}</div></div>`;
        })
        .join('')}
      ${FILTERS[cat].some(([g]) => sel(cat, g).length) || F.q ? '<button class="clear" id="clr">清除全部篩選</button>' : ''}
    </aside>`;
  const body =
    cat === 'terms'
      ? `<div class="terms">${rows.map(t => `<div class="term" id="t-${D.terms.indexOf(t)}"><b>${esc(t.n)}</b>${rich(t.d, t.n)}</div>`).join('')}</div>`
      : `<div class="grid">${rows.map(x => cardOf(cat, x)).join('')}</div>`;
  document.getElementById('view').innerHTML = `<div class="layout">${side}<main><div class="count">${rows.length} 項${rows.length < LIST[cat].length ? `（共 ${LIST[cat].length}）` : ''}</div>${rows.length ? body : '<div class="empty">沒有符合的項目，試試清除篩選</div>'}</main></div>`;
  const q = document.getElementById('q');
  q.oninput = () => {
    F.q = q.value;
    keep();
    const pos = q.selectionStart;
    listView(cat);
    const n = document.getElementById('q');
    n.focus();
    n.setSelectionRange(pos, pos);
  };
  document.querySelectorAll('.chip[data-g]').forEach(b => (b.onclick = () => {
    const s = sel(cat, b.dataset.g), v = b.dataset.v, i = s.indexOf(v);
    i < 0 ? s.push(v) : s.splice(i, 1);
    keep();
    listView(cat);
  }));
  const c = document.getElementById('clr');
  if (c) c.onclick = () => { F.q = ''; F.sel[cat] = {}; keep(); listView(cat); };
}
const kv = L => `<div class="kv">${L.filter(x => x[1] !== '' && x[1] != null).map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join('')}</div>`;
const tagsHTML = (L, el) => `<div class="tags">${el ? `<span class="tag el-${esc(el)}">${esc(el)}</span>` : ''}${L.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>`;
const fmt = n => (n == null ? '—' : n.toLocaleString('en-US'));
function skillView(x) {
  tabs('skills');
  const atk = !x.spell && x.lv[0].mult != null;
  const lvT = `<div class="tbl"><table><thead><tr><th>等級</th><th>角色等級需求</th>${x.spell && x.m ? '<th>平均基礎傷害</th>' : ''}${atk ? '<th>攻擊傷害倍率</th>' : ''}<th>魔力</th><th>出手時間</th><th>升到下一級（靈魂）</th></tr></thead><tbody>${x.lv
    .map(l => `<tr><td>Lv ${l.L}</td><td>${l.req}</td>${x.spell && x.m ? `<td>${fmt(l.dmg)}</td>` : ''}${atk ? `<td>${l.mult}%</td>` : ''}<td>${l.mp}</td><td>${l.t == null ? '—' : l.t + ' 秒'}</td><td>${fmt(l.soul)}</td></tr>`)
    .join('')}</tbody></table></div>`;
  const ascS = x.asc ? D.asc.find(a => x.asc.startsWith(a.n + '・')) : null;
  return `<div class="detail"><a class="back" href="#skills">← 主動技能</a>
    <div class="dh">${img(x.ic, 'big')}<div><h2>${esc(x.n)}</h2>${tagsHTML(x.tags, x.el)}</div></div>
    <div class="box"><h3>效果</h3><p class="desc">${rich(x.d)}</p>
      ${kv([
        ['武器', x.asc ? `昇華技能（${ascS ? `<a class="tlink" href="#asc-${id(ascS.k)}">${esc(x.asc)}</a>` : esc(x.asc)}）` : esc(x.wt.join('、'))],
        ['副手', esc(x.off)],
        ['傷害來源', x.spell ? (x.m ? `技能自己的傷害 × ${x.m}` : '不直接造成傷害') : x.m ? `武器傷害 × ${Math.round(x.m * 100)}%（Lv1）` : '不直接造成傷害'],
        ['冷卻', x.cd ? x.cd + ' 秒' : ''],
        ['持續時間', x.dur ? x.dur + ' 秒' : ''],
        ['範圍', x.r ? x.r + '（30 = 1 公尺）' : '']
      ])}
      <p class="note">${x.spell ? '法術的基礎傷害是 7～12，每級 ×1.25，再乘上這招的倍率；表上是平均值，還沒算天賦、裝備與輔助。' : '攻擊的傷害是武器傷害乘上倍率；表上的倍率還沒算天賦、裝備與輔助。'}魔力在 Lv1 只要一半，到 Lv10 回到原值。</p></div>
    <div class="box"><h3>每一級</h3>${lvT}</div>
    ${x.aw.length ? `<div class="box"><h3>覺醒</h3><div class="aw">${x.aw.map(a => `<div><b>${a.x}・${esc(a.n)}</b><br>${rich(a.d)}</div>`).join('')}</div><p class="note">花 1 顆覺醒石選一邊，之後可以免費切換。</p></div>` : ''}
  </div>`;
}
function lvBox(rows, cols) {
  return `<div class="box"><h3>每一級</h3><div class="tbl"><table><thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(l => `<tr>${cols.map(c => `<td>${c[1](l)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
}
function supView(x) {
  tabs('supports');
  return `<div class="detail"><a class="back" href="#supports">← 輔助</a>
    <div class="dh">${img(x.ic, 'big')}<div><h2>${esc(x.n)}</h2>${tagsHTML(['輔助', ...x.need])}</div></div>
    <div class="box"><h3>效果</h3><p class="desc">${rich(x.d)}</p>${kv([
      ['能插在', esc(x.need.length ? x.need.join('、') + '技能' : '任何技能')],
      ['同組不能同插', esc(x.same.join('、'))]
    ])}<p class="note">${x.aw ? '覺醒輔助：四凶掉落，再撿到同一顆升一級，上限 Lv5，燭龍之心突破到 Lv6。' : x.ii ? `輔助沒有等級。II 要花 ${fmt(x.ii)} 靈魂解鎖一次，之後每個孔可以自由選 I 或 II。` : '輔助沒有等級。'}</p></div>
  </div>`;
}
function auraView(x) {
  tabs('auras');
  return `<div class="detail"><a class="back" href="#auras">← 光環／精魂</a>
    <div class="dh">${img(x.ic, 'big')}<div><h2>${esc(x.n)}</h2>${tagsHTML(['光環', ...x.tags])}</div></div>
    <div class="box"><h3>效果</h3><p class="desc">${rich(x.d)}</p>${kv([['預留精魂', x.sp]])}<p class="note">放在光環欄就一直生效、預留精魂；效果每級 +3%（表上的倍數乘在說明的數字上）。</p></div>
    ${lvBox(x.lv, [['等級', l => 'Lv ' + l.L], ['角色等級需求', l => l.req], ['效果倍數', l => '×' + l.eff.toFixed(2)], ['升到下一級（靈魂）', l => fmt(l.soul)]])}
  </div>`;
}
function ascView(x) {
  tabs('ascend');
  const gs = [...new Set(x.nodes.map(n => n.g).filter(Boolean))],
    gl = g => (gs.length > 1 ? ' ' + 'ABCDEFG'[gs.indexOf(g)] : ''),
    big = x.nodes.filter(n => n.t === 'big').length,
    sks = x.skills.map(k => D.sk.find(s => s.k === k)).filter(Boolean);
  return `<div class="detail"><a class="back" href="#ascend">← 昇華</a>
    <div class="dh">${img(x.ic, 'big')}<div><h2>${esc(x.n)}</h2><p class="desc">${rich(x.d)}</p></div></div>
    ${sks.length ? `<div class="box"><h3>送的技能</h3><div class="grid">${sks.map(s => cardOf('skills', s)).join('')}</div></div>` : ''}
    <div class="box"><h3>天賦點（${big} 個大點、${x.nodes.length - big} 個小點）</h3>
      <ul class="nodes">${x.nodes
        .map(n =>
          n.t === 'big'
            ? `<li>${img(n.ic)}<b>${esc(n.n)}${n.g ? `<span class="grp">選擇組${gl(n.g)}</span>` : ''}</b><span>${rich(n.d)}</span></li>`
            : `<li class="small">${img(n.ic)}<span>小點</span><span>${rich(n.d)}</span></li>`
        )
        .join('')}</ul>
      <p class="note">8 點＝4 大 4 小；同一個選擇組只能拿一個。點的順序照樹上的擺法（大點前面通常是它的小點）。</p></div>
  </div>`;
}
function route() {
  const h = location.hash.slice(1) || 'skills',
    v = document.getElementById('view');
  const find = (L, p) => L.find(x => id(x.k) === h.slice(p.length));
  let html = null;
  if (h.startsWith('sk-') && find(D.sk, 'sk-')) html = skillView(find(D.sk, 'sk-'));
  else if (h.startsWith('sup-') && find(D.sup, 'sup-')) html = supView(find(D.sup, 'sup-'));
  else if (h.startsWith('aura-') && find(D.aura, 'aura-')) html = auraView(find(D.aura, 'aura-'));
  else if (h.startsWith('asc-') && find(D.asc, 'asc-')) html = ascView(find(D.asc, 'asc-'));
  if (html != null) {
    v.innerHTML = html;
    window.scrollTo(0, 0);
    return;
  }
  if (h.startsWith('t-')) {
    listView('terms');
    const e = document.getElementById(h);
    if (e) e.classList.add('hit'), e.scrollIntoView({ block: 'center' });
    return;
  }
  listView(CAT.some(c => c[0] === h) ? h : 'skills');
}
addEventListener('hashchange', route);
route();
</script>
